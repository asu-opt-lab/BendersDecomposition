<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
<style>
.box { fill:#f8f9fb; stroke:#2f3b52; stroke-width:1.5; rx:10; }
.title { font: bold 16px sans-serif; fill:#1f2937; }
.text { font: 13px sans-serif; fill:#374151; }
.arrow { stroke:#4b5563; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
</style>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
</marker>
</defs>

<!-- Master -->
<rect x="60" y="140" width="200" height="80" class="box" />
<text x="160" y="165" text-anchor="middle" class="title">Master</text>
<text x="160" y="190" text-anchor="middle" class="text">JuMP model</text>

<!-- Oracle -->
<rect x="320" y="60" width="220" height="80" class="box" />
<text x="430" y="85" text-anchor="middle" class="title">Oracle</text>
<text x="430" y="110" text-anchor="middle" class="text">Cut generation</text>

<!-- Environment -->
<rect x="320" y="220" width="220" height="80" class="box" />
<text x="430" y="245" text-anchor="middle" class="title">Environment</text>
<text x="430" y="270" text-anchor="middle" class="text">Execution control</text>

<!-- Arrows -->
<path d="M260 160 L320 100" class="arrow" />
<path d="M320 260 L260 200" class="arrow" />
<path d="M430 140 L430 220" class="arrow" />

<!-- Labels -->
<text x="300" y="110" class="text">dual info</text>
<text x="300" y="235" class="text">cuts</text>
<text x="440" y="185" class="text">iteration loop</text>
</svg>