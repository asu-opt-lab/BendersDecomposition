name: Deploy docs (Documenter)

on:
  push:
    branches:
      - main
      - documentation

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.9"

      - name: Install dependencies for docs
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          # Uncomment if your make.jl expects a DOCUMENTER_KEY (not required for peaceiris GH Pages step)
          # DOCUMENTER_KEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_files: false
